---
- name: sshd | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_facts['distribution'] }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

- name: sshd | Include distro-specific variables
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['distribution'] }}.yml"

- name: sshd | Detect systemd socket activation (ssh.socket)
  ansible.builtin.command: systemctl is-enabled ssh.socket
  register: sshd_socket_is_enabled
  changed_when: false
  failed_when: false
  check_mode: false
  when: sshd_manage_socket | bool

- name: sshd | Set socket activation fact
  ansible.builtin.set_fact:
    sshd_socket_activated: >-
      {{ (sshd_manage_socket | bool)
         and (sshd_socket_is_enabled.rc | default(1)) == 0
         and ('enabled' in (sshd_socket_is_enabled.stdout | default(''))) }}

- name: sshd | Check if sshd_config backup exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.orig
  register: sshd_backup

- name: sshd | Backup original sshd_config
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.orig
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not sshd_backup.stat.exists

- name: sshd | Check if sshd_config.d backup exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d.orig
  register: sshd_config_d_backup
  when: sshd_clean_config_d | bool

- name: sshd | Backup sshd_config.d directory
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config.d/
    dest: /etc/ssh/sshd_config.d.orig/
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - sshd_clean_config_d | bool
    - not sshd_config_d_backup.stat.exists

- name: sshd | Find config files in sshd_config.d
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
  register: sshd_config_d_files
  when: sshd_clean_config_d | bool

- name: sshd | Remove all files in sshd_config.d
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sshd_config_d_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart sshd
  when:
    - sshd_clean_config_d | bool
    - sshd_config_d_files.files | length > 0

# Filter crypto lists to algorithms the host's OpenSSH actually supports.
# Prevents `sshd -t` from rejecting the whole config when a newer algorithm
# (e.g. post-quantum mlkem768x25519-sha256, OpenSSH 9.9+) is unknown on an
# older host (e.g. OpenSSH 9.6 on Ubuntu 24.04).
- name: sshd | Query supported KexAlgorithms
  ansible.builtin.command: ssh -Q kex
  register: sshd_supported_kex
  changed_when: false
  check_mode: false

- name: sshd | Query supported Ciphers
  ansible.builtin.command: ssh -Q cipher
  register: sshd_supported_ciphers
  changed_when: false
  check_mode: false

- name: sshd | Query supported MACs
  ansible.builtin.command: ssh -Q mac
  register: sshd_supported_macs
  changed_when: false
  check_mode: false

- name: sshd | Compute host-supported crypto lists
  ansible.builtin.set_fact:
    # Keep the desired order, drop anything the host does not support.
    sshd_kex_algorithms_effective: >-
      {{ sshd_kex_algorithms | split(',')
         | select('in', sshd_supported_kex.stdout_lines) | join(',') }}
    sshd_ciphers_effective: >-
      {{ sshd_ciphers | split(',')
         | select('in', sshd_supported_ciphers.stdout_lines) | join(',') }}
    sshd_macs_effective: >-
      {{ sshd_macs | split(',')
         | select('in', sshd_supported_macs.stdout_lines) | join(',') }}

- name: sshd | Deploy sshd configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Restart sshd

# Socket activation: the listening port is owned by ssh.socket, not sshd_config.
# Deploy a drop-in to override ListenStream when a non-default port is used.
- name: sshd | Create ssh.socket drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - sshd_socket_activated | default(false) | bool
    - sshd_port | int != 22

- name: sshd | Deploy ssh.socket port override
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/override.conf
    owner: root
    group: root
    mode: "0644"
    # First empty ListenStream clears the default (port 22), then set the new port.
    content: |
      # {{ ansible_managed }}
      [Socket]
      ListenStream=
      ListenStream={{ sshd_port }}
  when:
    - sshd_socket_activated | default(false) | bool
    - sshd_port | int != 22
  notify: Restart sshd

- name: sshd | Remove ssh.socket port override when using default port
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d/override.conf
    state: absent
  when:
    - sshd_socket_activated | default(false) | bool
    - sshd_port | int == 22
  notify: Restart sshd
